# CNB pipeline: keeps the same checks as GitHub Actions by delegating to
# scripts/ci.sh, so both platforms run one shared definition.
.pipeline: &pipeline
  runner:
    tags: cnb:arch:amd64
  stages:
    - name: ci
      script: sh scripts/ci.sh

main:
  push:
    - <<: *pipeline
      name: push
  pull_request:
    - <<: *pipeline
      name: pull-request

"**":
  push:
    - <<: *pipeline
      name: push-branch
