name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: check / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        uses: moonbitlang/setup-moonbit@main

      - name: Run CI
        run: sh scripts/ci.sh
        shell: bash

  # Runs the integration suite against a real Chroma server. Kept out of the
  # `ci` job above for two reasons: the service container only works on Linux,
  # and the default checks should not fail when the image cannot be pulled.
  #
  # GitHub starts the service and the MoonBit tests connect to it over
  # localhost; the same tests are driven by scripts/integration.sh on CNB,
  # which starts the container itself.
  integration:
    name: integration (chroma)
    runs-on: ubuntu-latest
    services:
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8000:8000
        env:
          CHROMA_SERVER_HOST: 0.0.0.0
        # Without a health check the first request races the server's start-up
        # and the suite fails with connection refused.
        options: >-
          --health-cmd "python -c \"import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat')\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        uses: moonbitlang/setup-moonbit@main

      - name: Run integration tests
        run: moon test --target native --deny-warn -p SundayT1998/chroma-client/integration
        shell: bash
        env:
          CHROMA_ENDPOINT: http://127.0.0.1:8000
          CHROMA_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
