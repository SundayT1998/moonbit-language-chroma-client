name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: check / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The toolchain comes from the install scripts on
      # https://www.moonbitlang.com/download/ rather than from a setup action:
      # moonbitlang/setup-moonbit no longer resolves, which failed every job
      # before the first check ran. install/unix.sh covers Linux and macOS and
      # installs into $HOME/.moon; install/powershell.ps1 covers Windows and
      # only updates PATH for future processes, so the runner's own PATH is
      # extended by hand in both branches.
      - name: Install MoonBit
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex"
            echo "${USERPROFILE}/.moon/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
            echo "${HOME}/.moon/bin" >> "$GITHUB_PATH"
          fi

      - name: Run CI
        run: sh scripts/ci.sh
        shell: bash

  # Runs the integration suite against a real Chroma server. Kept out of the
  # `ci` job above for two reasons: the server needs a Docker daemon, and the
  # default checks should not fail when the image cannot be pulled.
  #
  # GitHub and CNB both go through scripts/integration.sh, which starts the
  # container, waits for it and exports CHROMA_ENDPOINT; the tests themselves
  # skip when that variable is unset.
  integration:
    name: integration (chroma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain comes from the install scripts on
      # https://www.moonbitlang.com/download/ rather than from a setup action:
      # moonbitlang/setup-moonbit no longer resolves, which failed every job
      # before the first check ran. install/unix.sh covers Linux and macOS and
      # installs into $HOME/.moon; install/powershell.ps1 covers Windows and
      # only updates PATH for future processes, so the runner's own PATH is
      # extended by hand in both branches.
      - name: Install MoonBit
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex"
            echo "${USERPROFILE}/.moon/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
            echo "${HOME}/.moon/bin" >> "$GITHUB_PATH"
          fi

      # Chroma used to be a `services:` sidecar, but GitHub reports "Service
      # container chroma failed" without any log from the server, and the
      # image's own health check is a python one-liner that a moving `latest`
      # tag can invalidate. scripts/integration.sh starts the server itself —
      # the same script the CNB pipeline runs — waits for /api/v2/heartbeat and
      # prints the container logs when it does not come up.
      - name: Run integration tests
        run: sh scripts/integration.sh
        shell: bash
        env:
          CHROMA_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
